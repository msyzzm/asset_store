<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>素材库</title>
  <link rel="stylesheet" href="style.css">
  <!-- three.js is vendored (the server may have no internet) and only loaded when a model is opened. -->
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/build/three.module.min.js",
        "three/addons/": "/vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header class="bar">
    <div class="bar-main">
      <h1>素材库</h1>
      <input id="q" type="search" placeholder="搜索文件名或路径，空格分隔多个词" autocomplete="off" autofocus>
      <button id="settings-btn" class="btn secondary" type="button" title="看图描述和素材整理用的模型">设置</button>
    </div>
    <nav id="kinds" class="kinds" aria-label="按类型筛选"></nav>
  </header>
  <section class="tasks" aria-label="任务">
    <div id="task-scan" class="task">
      <span class="task-dot" aria-hidden="true"></span>
      <span class="task-name">扫描</span>
      <span id="scan-status" class="task-text" aria-live="polite"></span>
      <progress id="scan-task-bar" class="task-bar" max="1" value="0" hidden></progress>
      <span class="task-actions">
        <button id="scan" class="link-btn" type="button" title="NAS 上加了新素材后，点这里马上重新扫描">立即扫描</button>
        <button id="scan-stop" class="link-btn" type="button" hidden>停止</button>
      </span>
    </div>
    <div id="task-caption" class="task">
      <span class="task-dot" aria-hidden="true"></span>
      <span class="task-name">看图描述</span>
      <span id="caption-task-text" class="task-text" aria-live="polite"></span>
      <progress id="caption-task-bar" class="task-bar" max="1" value="0" hidden></progress>
      <span class="task-actions">
        <button id="caption-task-stop" class="link-btn" type="button" hidden>停止</button>
        <button id="caption-task-open" class="link-btn" type="button">打开</button>
      </span>
    </div>
    <div id="task-update" class="task">
      <span class="task-dot" aria-hidden="true"></span>
      <span class="task-name">更新</span>
      <span id="update-task-text" class="task-text"></span>
      <span class="task-actions">
        <button id="update-check" class="link-btn" type="button" hidden>检查</button>
        <button id="update-run" class="link-btn" type="button" hidden>更新</button>
        <button id="update-stop" class="link-btn" type="button" hidden>停止</button>
      </span>
    </div>
    <div id="task-organize" class="task">
      <span class="task-dot" aria-hidden="true"></span>
      <span class="task-name">整理</span>
      <span id="organize-task-text" class="task-text"></span>
      <span class="task-actions">
        <button id="organize-task-stop" class="link-btn" type="button" hidden>停止</button>
        <a class="link-btn" href="/organize.html">打开</a>
      </span>
    </div>
  </section>
  <p id="summary" class="summary"></p>
  <main id="grid" class="grid"></main>
  <button id="more" class="more" type="button" hidden>加载更多</button>

  <dialog id="viewer" class="viewer">
    <div class="viewer-head">
      <h2 id="v-name"></h2>
      <button id="v-close" class="icon-btn" type="button" aria-label="关闭">✕</button>
    </div>
    <div id="v-preview" class="viewer-preview"></div>
    <dl id="v-meta" class="viewer-meta"></dl>
    <div class="viewer-actions">
      <a id="v-download" class="btn">下载</a>
      <button id="v-copy" class="btn secondary" type="button">复制路径</button>
    </div>
  </dialog>

  <dialog id="settings" class="viewer settings">
    <div class="viewer-head">
      <h2>看图模型</h2>
      <button id="s-close" class="icon-btn" type="button" aria-label="关闭">✕</button>
    </div>
    <p class="hint">一个能看图的模型（OpenAI 兼容的 chat 接口，比如 Strata 上的 Qwen）。「看图描述」和「素材整理」都用它。</p>
    <form id="c-form" class="settings-form">
      <label>接口地址 <input name="base_url" placeholder="http://192.168.1.10:8080/v1" autocomplete="off"></label>
      <label>模型名 <input name="model" placeholder="Strata 随便填，其他服务填真实模型名" autocomplete="off"></label>
      <label>API key <input name="api_key" type="password" autocomplete="new-password"></label>
      <p class="hint">key 只保存在服务器上，不会再显示出来。改了接口地址要重新填 key。</p>
      <div class="viewer-actions">
        <button class="btn" type="submit">保存</button>
        <button id="c-test" class="btn secondary" type="button">测试（描述一张示例图）</button>
      </div>
    </form>
    <p id="c-setup-status" class="settings-status" aria-live="polite"></p>
  </dialog>

  <dialog id="captions" class="viewer settings">
    <div class="viewer-head">
      <h2>看图描述</h2>
      <button id="c-close" class="icon-btn" type="button" aria-label="关闭">✕</button>
    </div>
    <p class="hint">让一个能看图的模型（OpenAI 兼容的 chat 接口，比如 Strata 上的 Qwen）给图片写一句中文描述和关键词。写好后，搜索框能按画面内容找到图片。每张图要几秒，只在你点「开始」时才跑。模型在右上角「设置」里设置。</p>
    <form id="c-scope" class="settings-form">
      <label>根目录 <select name="root"></select></label>
      <label>文件夹（留空 = 整个根目录）
        <input name="prefix" list="c-folders" placeholder="例如 2DPixel/PM895" autocomplete="off">
        <datalist id="c-folders"></datalist>
      </label>
      <label class="check"><input name="redo" type="checkbox"> 已经有描述的也重新描述</label>
      <p id="c-count" class="hint" aria-live="polite"></p>
      <p id="c-need-model" class="hint" hidden>还没设置看图模型：先点右上角「设置」。</p>
      <div class="viewer-actions">
        <button id="c-start" class="btn" type="submit">开始</button>
        <button id="c-stop" class="btn secondary" type="button" hidden>停止</button>
      </div>
    </form>
    <progress id="c-bar" class="caption-bar" max="1" value="0" hidden></progress>
    <p id="c-status" class="settings-status" aria-live="polite"></p>
  </dialog>

  <script src="app.js"></script>
  <script src="settings.js"></script>
  <script src="captions.js"></script>
  <script src="update.js"></script>
  <script src="organize-bar.js"></script>
</body>
</html>
