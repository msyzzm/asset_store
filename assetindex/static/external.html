<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>外部素材</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="external.css">
</head>
<body>
  <header class="bar">
    <div class="bar-main">
      <h1><a class="home" href="/">素材库</a> / 外部素材</h1>
      <form id="x-form" class="x-form" role="search">
        <input id="q" type="search" placeholder="英文关键词，比如 brick wall、sword、pixel art" autocomplete="off" autofocus>
        <button class="btn" type="submit">搜索</button>
      </form>
      <button id="x-keys-btn" class="btn secondary" type="button" title="Sketchfab、Freesound、Poly Pizza 要的 key">网站账号</button>
    </div>
    <div class="x-sources" role="group" aria-label="搜哪些网站">
      <label><input type="checkbox" name="source" value="polyhaven" checked> Poly Haven</label>
      <label><input type="checkbox" name="source" value="ambientcg" checked> ambientCG</label>
      <label><input type="checkbox" name="source" value="opengameart" checked> OpenGameArt</label>
      <label><input type="checkbox" name="source" value="itch" checked> itch.io</label>
      <label><input type="checkbox" name="source" value="sketchfab" checked> Sketchfab</label>
      <label><input type="checkbox" name="source" value="freesound" checked> Freesound</label>
      <label><input type="checkbox" name="source" value="polypizza" checked> Poly Pizza</label>
      <label><input type="checkbox" name="source" value="openverse_images" checked> Openverse 图片</label>
      <label><input type="checkbox" name="source" value="openverse_audio" checked> Openverse 音频</label>
      <span class="filters-note">看中了点开，选规格下载到素材库的 <code>_下载</code>。Poly Haven、ambientCG 都是 CC0；其他网站授权各异，详情里看（要署名的会给出署名文字）；itch.io 只按英文标签列免费素材，要到原页面手动下载。</span>
    </div>
  </header>
  <p id="x-hint" class="x-hint" hidden>这些网站只认英文：试试 bricks、grass、rock、wood、sky、sword、pixel art。</p>
  <main id="x-results"></main>

  <dialog id="x-viewer" class="viewer x-viewer">
    <div class="viewer-head">
      <h2 id="xv-title"></h2>
      <button id="xv-close" class="icon-btn" type="button" aria-label="关闭">✕</button>
    </div>
    <div id="xv-preview" class="viewer-preview"></div>
    <dl id="xv-meta" class="viewer-meta"></dl>
    <h3 class="xv-sub">下载到素材库</h3>
    <ul id="xv-options" class="xv-options"></ul>
    <p id="xv-status" class="settings-status" aria-live="polite"></p>
  </dialog>

  <dialog id="x-keys" class="viewer settings">
    <div class="viewer-head">
      <h2>网站账号</h2>
      <button id="xk-close" class="icon-btn" type="button" aria-label="关闭">✕</button>
    </div>
    <p class="hint">这几个网站要你自己账号的 key，注册都免费。key 只保存在服务器上，保存后不会再显示出来。</p>
    <div id="xk-sites" class="xk-sites"></div>
    <p id="xk-status" class="settings-status" aria-live="polite"></p>
  </dialog>

  <script src="external.js"></script>
</body>
</html>
