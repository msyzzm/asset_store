# Copy .env.example to .env and edit it, then: docker compose up -d --build
# All services share one image and one data volume. The scanner writes the index; the
# web process reads it and writes on-demand thumbnails.

x-app: &app
  build: .
  image: assetindex:latest
  restart: unless-stopped
  init: true  # forwards SIGTERM so `docker compose stop` doesn't wait 10s and SIGKILL
  # Both parse untrusted archives and images: no extra privileges for a compromised parser.
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  environment:
    ASSET_ROOTS: ${ASSET_ROOTS:-nas=/assets}
    ASSET_THUMB_CACHE_MB: ${ASSET_THUMB_CACHE_MB:-4096}
  volumes:
    # The NAS, read-only: nothing here ever writes to it.
    - ${ASSET_NAS_PATH:?set ASSET_NAS_PATH in .env}:/assets:ro
    # Index + thumbnails. Must be local disk (SQLite WAL and file locks break on NFS).
    - asset-data:/data

services:
  web:
    <<: *app
    ports:
      # No login. Listens on all interfaces by default; set ASSET_BIND to one address to
      # narrow it (Docker port rules bypass ufw, so a firewall inside the LXC won't help).
      - "${ASSET_BIND:-0.0.0.0}:${ASSET_PORT:-8000}:8000"
    # Up to 4 thumbnail renders of 50-megapixel images at once, ~200 MB each while decoding.
    mem_limit: ${WEB_MEM_LIMIT:-2g}

  scanner:
    <<: *app
    command: ["python", "-m", "assetindex", "scan", "--every", "${SCAN_INTERVAL_SECONDS:-21600}"]
    healthcheck:
      disable: true
    # An archive that blows past this gets the scanner killed; after 2 such kills the
    # archive is marked bad and skipped (see assetindex/attempts.py).
    mem_limit: ${SCANNER_MEM_LIMIT:-3g}

  # Idle until a "看图描述" job is started from the web UI; then describes pictures one
  # by one with the vision model set up there. Separate from the scanner so a job that
  # takes hours never holds up scheduled scans.
  captioner:
    <<: *app
    command: ["python", "-m", "assetindex", "caption", "--watch"]
    healthcheck:
      disable: true
    mem_limit: ${CAPTIONER_MEM_LIMIT:-1g}

  # Idle until "开始移动" on the organize page: carries out confirmed proposals. The only
  # service that may write the NAS, and only with ASSET_MOVER_ACCESS=rw in .env; read-only
  # otherwise, so the move plan can be looked at but nothing moves.
  mover:
    <<: *app
    command: ["python", "-m", "assetindex", "move", "--watch"]
    healthcheck:
      disable: true
    mem_limit: ${MOVER_MEM_LIMIT:-768m}
    volumes:
      - ${ASSET_NAS_PATH:?set ASSET_NAS_PATH in .env}:/assets:${ASSET_MOVER_ACCESS:-ro}
      - asset-data:/data

volumes:
  asset-data:
